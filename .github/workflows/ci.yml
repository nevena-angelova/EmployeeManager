name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back end
    runs-on: ubuntu-latest

    # The integration tests create and drop employee_manager_test_* databases here;
    # POSTGRES_USER gets CREATEDB.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: employee_manager
          POSTGRES_PASSWORD: employee_manager
          POSTGRES_DB: employee_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U employee_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build backend/EmployeeManager.slnx

      - name: Test
        run: dotnet test backend/EmployeeManager.slnx --no-build

  frontend:
    name: Front end
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/employee-manager-client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/employee-manager-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false
