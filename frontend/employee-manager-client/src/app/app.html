<header class="app-header">
  <a class="brand" routerLink="/" aria-label="EmployeeManager home">
    <svg class="brand-mark" viewBox="0 0 32 20" aria-hidden="true">
      <path d="M5 15 H15 L22 5 H27" />
      <circle cx="5" cy="15" r="3.5" />
      <circle cx="27" cy="5" r="3.5" />
    </svg>
    <h1>{{ title() }}</h1>
  </a>
  @if (user(); as user) {
    <nav class="main-nav" aria-label="Main">
      <a routerLink="/org-chart" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Org chart</a
      >
      @if (isAdmin()) {
        <a routerLink="/employees" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Employees</a
        >
      }
    </nav>
    <div class="account">
      <span class="who">
        <span class="user-name">{{ user.firstName }} {{ user.lastName }}</span>
        <span class="role">{{ user.role }}</span>
      </span>
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  }
</header>
<main>
  <router-outlet />
</main>
