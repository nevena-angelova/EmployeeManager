<article class="station" [class.top]="!onLine()" [class.collapsed]="collapsed()">
  <span class="stop" aria-hidden="true"></span>
  <p class="name">{{ fullName() }}</p>
  <p class="job-title">{{ node().jobTitle }}</p>
  <a class="email" [href]="'mailto:' + node().email">{{ node().email }}</a>
  @if (reportCount()) {
    <button type="button" class="toggle" [attr.aria-expanded]="!collapsed()" (click)="toggle()">
      <span class="chevron" aria-hidden="true">▾</span>
      {{ reportCount() }} {{ reportCount() === 1 ? 'report' : 'reports' }}
    </button>
  }
</article>

@if (reportCount() && !collapsed()) {
  <ul class="reports" [class.reveal]="revealOnOpen()">
    @for (child of node().directReports; track child.id) {
      <li [style.--line]="colour(child.id)">
        <app-org-chart-branch [node]="child" [lines]="lines()" />
      </li>
    }
  </ul>
}
